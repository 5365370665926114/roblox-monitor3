name: DPL InnerTubeX 0.5.1 AAR

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dpl-toolchain.yml

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download exact InnerTubeX Android AAR
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://jitpack.io/com/github/MetrolistGroup/innertubex/innertubex-android/v0.5.1/innertubex-android-v0.5.1.aar'
          curl -fL --retry 3 "$URL" -o "$RUNNER_TEMP/innertubex-android-v0.5.1.aar"
          test -s "$RUNNER_TEMP/innertubex-android-v0.5.1.aar"
          file "$RUNNER_TEMP/innertubex-android-v0.5.1.aar"
          sha1sum "$RUNNER_TEMP/innertubex-android-v0.5.1.aar"
          ls -lh "$RUNNER_TEMP/innertubex-android-v0.5.1.aar"

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: innertubex-android-v0.5.1-aar
          path: ${{ runner.temp }}/innertubex-android-v0.5.1.aar
          compression-level: 0
          retention-days: 1
