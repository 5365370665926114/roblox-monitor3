name: DPL InnerTubeX 0.5.1 Artifact Cache

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dpl-toolchain.yml

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone exact Metrolist base and pin InnerTubeX 0.5.1
        shell: bash
        run: |
          git clone https://github.com/MetrolistGroup/Metrolist.git "$RUNNER_TEMP/metrolist"
          cd "$RUNNER_TEMP/metrolist"
          git checkout 665ad436803ba6d3983c245f8f2aaaa45c9e3eaa
          sed -i 's/innertubex = "v0.5.2"/innertubex = "v0.5.1"/' gradle/libs.versions.toml
          cat >> app/build.gradle.kts <<'EOF'

          tasks.register("resolveDplFossClasspath") {
              doLast {
                  configurations.getByName("fossDebugCompileClasspath").resolve()
              }
          }
          EOF
          chmod +x gradlew

      - name: Materialize compile artifacts
        shell: bash
        run: |
          cd "$RUNNER_TEMP/metrolist"
          ./gradlew :app:resolveDplFossClasspath --no-configuration-cache --no-daemon --console=plain

      - name: Pack InnerTubeX 0.5.1 cache entries
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pack/files-2.1" "$RUNNER_TEMP/pack/descriptors"
          cp -a "$HOME/.gradle/caches/modules-2/files-2.1/com.github.MetrolistGroup.innertubex" "$RUNNER_TEMP/pack/files-2.1/"
          META=$(find "$HOME/.gradle/caches/modules-2" -maxdepth 1 -type d -name 'metadata-*' | head -1)
          cp -a "$META/descriptors/com.github.MetrolistGroup.innertubex" "$RUNNER_TEMP/pack/descriptors/"
          find "$RUNNER_TEMP/pack" -type f -maxdepth 12 -printf '%P %s\n'

      - name: Upload InnerTubeX cache
        uses: actions/upload-artifact@v4
        with:
          name: innertubex-v0.5.1-full-cache
          path: ${{ runner.temp }}/pack
          compression-level: 6
          retention-days: 1
