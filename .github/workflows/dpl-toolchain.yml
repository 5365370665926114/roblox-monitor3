name: DPL Build Tools 36

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dpl-toolchain.yml

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Build Tools 36.0.0
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;36.0.0"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          du -sh "$ANDROID_HOME/build-tools/36.0.0"

      - name: Upload Build Tools 36.0.0
        uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-36.0.0
          path: ${{ env.ANDROID_HOME }}/build-tools/36.0.0
          compression-level: 6
          retention-days: 1
