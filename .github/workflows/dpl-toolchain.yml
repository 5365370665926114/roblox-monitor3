name: DPL Toolchain Split

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dpl-toolchain.yml

permissions:
  actions: read
  contents: read

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download compiled toolchain artifact
        uses: actions/download-artifact@v4
        with:
          name: dpl-offline-toolchain
          path: ${{ runner.temp }}/input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 33714465757

      - name: Split into connector-sized parts
        shell: bash
        run: |
          ls -lh "$RUNNER_TEMP/input"
          mkdir -p "$RUNNER_TEMP/parts"
          split -b 400M -d -a 1 "$RUNNER_TEMP/input/dpl-offline-toolchain.tar.gz" "$RUNNER_TEMP/parts/part-"
          ls -lh "$RUNNER_TEMP/parts"

      - name: Upload part 0
        uses: actions/upload-artifact@v4
        with:
          name: dpl-toolchain-part-0
          path: ${{ runner.temp }}/parts/part-0
          compression-level: 0
          retention-days: 1

      - name: Upload part 1
        uses: actions/upload-artifact@v4
        with:
          name: dpl-toolchain-part-1
          path: ${{ runner.temp }}/parts/part-1
          compression-level: 0
          retention-days: 1

      - name: Upload part 2
        uses: actions/upload-artifact@v4
        with:
          name: dpl-toolchain-part-2
          path: ${{ runner.temp }}/parts/part-2
          compression-level: 0
          retention-days: 1
